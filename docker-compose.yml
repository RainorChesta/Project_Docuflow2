services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: dokuflow-onlyoffice
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=dokuflow_onlyoffice_secret_key_2026
      - JWT_HEADER=Authorization
      - USE_UNAUTHORIZED_STORAGE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - ./docker/onlyoffice/app/view/PageSizeDialog.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/PageSizeDialog.js:ro
      - ./docker/onlyoffice/app/view/PageSizeDialog.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/PageSizeDialog.js.gz:ro
      - ./docker/onlyoffice/app/view/FileMenuPanels.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/FileMenuPanels.js:ro
      - ./docker/onlyoffice/app/view/FileMenuPanels.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/FileMenuPanels.js.gz:ro
      - ./docker/onlyoffice/app/controller/Main.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/controller/Main.js:ro
      - ./docker/onlyoffice/app/controller/Main.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/controller/Main.js.gz:ro
      - ./docker/onlyoffice/code.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/code.js:ro
      - ./docker/onlyoffice/code.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/code.js.gz:ro

volumes:
  onlyoffice_data:
  onlyoffice_log:
