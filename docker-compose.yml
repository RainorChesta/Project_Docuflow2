services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: dokuflow-onlyoffice
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=dokuflow_onlyoffice_secret_key_2026
      - JWT_HEADER=Authorization
      - USE_UNAUTHORIZED_STORAGE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - ./docker/onlyoffice/app/view/PageSizeDialog.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/PageSizeDialog.js:rw
      - ./docker/onlyoffice/app/view/PageSizeDialog.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/PageSizeDialog.js.gz:rw
      - ./docker/onlyoffice/app/view/FileMenuPanels.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/FileMenuPanels.js:rw
      - ./docker/onlyoffice/app/view/FileMenuPanels.js.gz:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/FileMenuPanels.js.gz:rw
      - ./docker/onlyoffice/app/view/Toolbar.js:/var/www/onlyoffice/documentserver/web-apps/apps/documenteditor/main/app/view/Toolbar.js:rw
