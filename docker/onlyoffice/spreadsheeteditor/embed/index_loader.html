        <style type="text/css">
        .loadmask {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            border: none;
            background-color: #f8fafc;
            z-index: 20002;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: opacity 0.3s ease-out;
        }

        .dokuflow-loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .dokuflow-spinner-box {
            position: relative;
            width: 92px;
            height: 92px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }

        .dokuflow-aura {
            position: absolute;
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, rgba(16, 185, 129, 0.22) 55%, transparent 72%);
            filter: blur(14px);
            animation: dokuflow-pulse 2.4s ease-in-out infinite;
        }

        .dokuflow-ring {
            position: relative;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, #2563eb, #10b981, #06b6d4, #2563eb);
            animation: dokuflow-spin 1.8s linear infinite;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dokuflow-ring-inner {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            border-radius: 50%;
        }

        .dokuflow-logo-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .dokuflow-svg-logo {
            width: 46px;
            height: 46px;
            animation: dokuflow-float 2.4s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
        }

        .dokuflow-loader-text {
            text-align: center;
        }

        .dokuflow-loader-brand {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .dokuflow-loader-msg {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
        }

        @keyframes dokuflow-spin {
            to { transform: rotate(360deg); }
        }

        @keyframes dokuflow-float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-3px) scale(1.04); }
        }

        @keyframes dokuflow-pulse {
            0%, 100% { opacity: 0.45; transform: scale(0.96); }
            50% { opacity: 0.85; transform: scale(1.15); }
        }
    </style>
