    <style type="text/css">
        .loadmask {
            left: 0;
            top: 0;
            position: absolute;
            height: 100%;
            width: 100%;
            overflow: hidden;
            border: none;
            background-color: #f4f4f4;
            z-index: 1000;
        }

        .loadmask > .brendpanel {
            width: 100%;
            position: absolute;
            height: 28px;
            background-color: #F7F7F7;
            -webkit-box-shadow: inset 0 -1px 0 #dbdbdb, inset 0 1px 0 #FAFAFA;
            box-shadow: inset 0 -1px 0 #dbdbdb, inset 0 1px 0 #FAFAFA;
        }

        .loadmask > .brendpanel > div {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .loadmask > .brendpanel .doc-title {
            flex-grow: 1;
        }

        .loadmask > .brendpanel .circle {
            vertical-align: middle;
            width: 24px;
            height: 24px;
            border-radius: 12px;
            margin: 4px 10px;
            background: rgba(255, 255, 255, 0.2);
        }

        .loadmask > .placeholder {
            background: #fbfbfb;
            width: 100%;
            height: 100%;
            padding-top: 56px;
        }

        .loadmask > .placeholder > .line {
            height: 15px;
            margin: 30px;
            background: #e2e2e2;
            overflow: hidden;
            position: relative;
            -webkit-animation: startFlickerAnimation 2s infinite ease-in-out;
            -moz-animation: startFlickerAnimation 2s infinite ease-in-out;
            -o-animation: startFlickerAnimation 2s infinite ease-in-out;
            animation: startFlickerAnimation 2s infinite ease-in-out;
        }

        @keyframes startFlickerAnimation {
            0%   { opacity:0.1; }
            50%  { opacity:1; }
            100% { opacity:0.1; }
        }
        @-o-keyframes startFlickerAnimation{
            0%   { opacity:0.1; }
            50%  { opacity:1; }
            100% { opacity:0.1; }
        }
        @-moz-keyframes startFlickerAnimation{
            0%   { opacity:0.1; }
            50%  { opacity:1; }
            100% { opacity:0.1; }
        }
        @-webkit-keyframes startFlickerAnimation{
            0%   { opacity:0.1; }
            50%  { opacity:1; }
            100% { opacity:0.1; }
        }

        .loadmask.none-animation > .placeholder > .line {
            animation: none;
        }

        .loadmask.end-animation > .placeholder > .line {
            -webkit-animation: endFlickerAnimation 2s infinite ease-in-out;
            -moz-animation: endFlickerAnimation 2s infinite ease-in-out;
            -o-animation: endFlickerAnimation 2s infinite ease-in-out;
            animation: endFlickerAnimation 2s infinite ease-in-out;
        }

        @keyframes endFlickerAnimation {
            0%   { opacity:1; }
            50%  { opacity:0.1; }
            100% { opacity:1; }
        }
        @-o-keyframes endFlickerAnimation{
            0%   { opacity:1; }
            50%  { opacity:0.1; }
            100% { opacity:1; }
        }
        @-moz-keyframes endFlickerAnimation{
            0%   { opacity:1; }
            50%  { opacity:0.1; }
            100% { opacity:1; }
        }
        @-webkit-keyframes endFlickerAnimation{
            0%   { opacity:1; }
            50%  { opacity:0.1; }
            100% { opacity:1; }
        }

    </style>

                        if (afterInfo && ((afterInfo.maxScrollTop <= 3) || (afterInfo.scrollTop <= 4))) {
                            var consumed = Math.max(0, beforeTop - afterInfo.scrollTop);
                            var overshoot = deltaPx + consumed;
                            if (overshoot < 0) {
                                sendOverscroll(overshoot, 'up');
                            }
                        }
                    }, 0);
                }
            } else {
                var hasVertScrollEl = document.getElementById('id_vertical_scroll');
                if (!hasVertScrollEl) {
                    sendOverscroll(deltaPx, 'up');
                }
            }
        }
        // Downward scroll
        else if (deltaPx > 0) {
            if (isInsideInternalScrollable(e.target, 'down')) return;

            var info = getDocScrollInfo();
            if (info) {
                var isAtBottom = (info.maxScrollTop <= 3) || (info.scrollTop >= info.maxScrollTop - 5);
                if (isAtBottom) {
                    sendOverscroll(deltaPx, 'down');
                } else {
                    var beforeTop = info.scrollTop;
                    setTimeout(function() {
                        var afterInfo = getDocScrollInfo();
                        if (afterInfo) {
                            var reachedBottom = (afterInfo.maxScrollTop <= 3) || (afterInfo.scrollTop >= afterInfo.maxScrollTop - 5);
                            if (reachedBottom) {
                                var consumed = Math.max(0, afterInfo.scrollTop - beforeTop);
                                var overshoot = deltaPx - consumed;
                                if (overshoot > 0) {
                                    sendOverscroll(overshoot, 'down');
                                }
                            }
                        }
                    }, 0);
                }
            } else {
                var hasVertScrollEl = document.getElementById('id_vertical_scroll');
                if (!hasVertScrollEl) {
                    sendOverscroll(deltaPx, 'down');
                }
            }
        }
    }

    window.addEventListener('wheel', handleWheel, { capture: true, passive: true });
    window.addEventListener('mousewheel', handleWheel, { capture: true, passive: true });
    window.addEventListener('DOMMouseScroll', handleWheel, { capture: true, passive: true });

    var touchStartY = null;
    var touchLastY = null;

    window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length === 1) {
            touchStartY = e.touches[0].clientY;
            touchLastY = touchStartY;
        } else {
            touchStartY = null;
            touchLastY = null;
        }
    }, { capture: true, passive: true });

    window.addEventListener('touchmove', function(e) {
        if (touchLastY === null || !e.touches || e.touches.length !== 1) return;
        var currentY = e.touches[0].clientY;
        var diffY = touchLastY - currentY;
        touchLastY = currentY;

        if (diffY < 0) {
            if (isInsideInternalScrollable(e.target, 'up')) return;
            var info = getDocScrollInfo();
            if (info && ((info.maxScrollTop <= 3) || (info.scrollTop <= 4))) {
                sendOverscroll(diffY * 1.5, 'up');
            } else if (!info && !document.getElementById('id_vertical_scroll')) {
                sendOverscroll(diffY * 1.5, 'up');
            }
        } else if (diffY > 0) {
            if (isInsideInternalScrollable(e.target, 'down')) return;
            var info = getDocScrollInfo();
            if (info && ((info.maxScrollTop <= 3) || (info.scrollTop >= info.maxScrollTop - 5))) {
                sendOverscroll(diffY * 1.5, 'down');
            } else if (!info && !document.getElementById('id_vertical_scroll')) {
                sendOverscroll(diffY * 1.5, 'down');
            }
        }
    }, { capture: true, passive: true });

    window.addEventListener('touchend', function() {
        touchStartY = null;
        touchLastY = null;
    }, { capture: true, passive: true });
})();
    </script>
